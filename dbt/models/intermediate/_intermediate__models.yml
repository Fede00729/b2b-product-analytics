version: 2

models:
  - name: int_identity__anonymous_to_user
    description: >
      Identity stitching. One row per anonymous_id that ever logged in, with the first
      user_id seen on it, so pre-login client events can be attributed to a user.
      Anonymous ids that never logged in are left out: there is no user to attribute them to.
    columns:
      - name: anonymous_id
        description: Client-side id set on the first visit (one per browser/device).
        data_tests: [unique, not_null]
      - name: user_id
        description: First product user that logged in from this anonymous_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_app__users')
                field: user_id
      - name: first_seen_at
        description: First client event of the anonymous_id, logged in or not.
        data_tests: [not_null]
      - name: identified_at
        description: First event where the anonymous_id appears with a user_id (usually the login).
        data_tests: [not_null]

  - name: int_accounts__crm_matched
    description: >
      One row per product account, enriched with its CRM record when one exists.
      The CRM uses a different id, so accounts are matched on the normalized domain.
      Unmatched accounts are kept (left join) with null CRM fields and is_crm_matched = false.
      The match rate is checked by tests/intermediate/assert_crm_match_rate_above_85_pct.sql.
    columns:
      - name: account_id
        description: Product account (agency) id.
        data_tests: [unique, not_null]
      - name: domain
        description: Normalized account domain, the join key to the CRM.
        data_tests: [not_null]
      - name: crm_account_id
        description: CRM id of the matched record. Null when the account has no CRM record.
        data_tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_crm__accounts')
                field: crm_account_id
      - name: crm_company_name
        description: Company name as stored in the CRM.
      - name: crm_segment
        description: Segment according to the CRM.
      - name: crm_annual_revenue_usd
        description: Annual revenue in USD according to the CRM.
      - name: crm_account_owner
        description: Sales rep that owns the account in the CRM.
      - name: crm_created_date
        description: Date the CRM record was created.
      - name: is_crm_matched
        description: True when a CRM record was found for the account's domain.
        data_tests: [not_null]

  - name: int_events__unified
    description: >
      Client and server events in one stream, one row per event. Pre-login client events
      get their user_id from int_identity__anonymous_to_user, and every client event gets
      the account_id of its user. Columns that only exist on one side are null on the other.
    columns:
      - name: event_id
        description: Event id (message_id on the client, event_id on the server).
        data_tests: [unique, not_null]
      - name: event_source
        description: Where the event was tracked.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [client, server]
      - name: event_name
        description: Event name, see docs/tracking_plan.md.
        data_tests: [not_null]
      - name: event_at
        description: When the event happened.
        data_tests: [not_null]
      - name: anonymous_id
        description: Client-side device id. Null for server events.
      - name: user_id
        description: >
          Product user. Null only for client events from devices that never logged in
          (warns instead of failing: real traffic has anonymous visitors).
        data_tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              arguments:
                to: ref('stg_app__users')
                field: user_id
      - name: account_id
        description: Product account of the user.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_app__accounts')
                field: account_id
      - name: is_user_id_stitched
        description: True when user_id came from identity stitching instead of the event itself.
        data_tests: [not_null]
      - name: quote_id
        description: Quote the event belongs to, when it is part of the quote flow.
      - name: line_of_business
        description: Insurance line of the quote.
      - name: carrier_id
        description: Carrier that returned a quote. Server only.
      - name: carriers_requested
        description: Number of carriers the quote was sent to. Server only.
      - name: premium_usd
        description: Premium of the returned or bound quote, in USD. Server only.
      - name: page_path
        description: Page where the event happened. Client only.
      - name: device_type
        description: Device of the client. Client only.
