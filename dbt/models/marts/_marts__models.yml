version: 2

models:
  - name: fct_quote_funnel
    description: >
      One row per quote, with the timestamp of each funnel step:
      form started -> submit clicked (client) -> submitted (server) -> first carrier return -> bound.
      Server events are the source of truth; is_client_submit_lost measures client-side tracking loss.
      policy_bound carries no carrier or premium, so the winning carrier is unknown.
      Funnel step order is checked by tests/marts/assert_quote_funnel_steps_in_order.sql.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "carrier_quotes_returned <= carriers_requested"
      # known data quality issue: warns so it stays visible without blocking the build
      - dbt_utils.expression_is_true:
          arguments:
            expression: "bound_at >= first_carrier_return_at"
          config:
            severity: warn
    columns:
      - name: quote_id
        description: Quote id, created when the quote form is opened.
        data_tests: [unique, not_null]
      - name: account_id
        description: Product account that requested the quote.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_app__accounts')
                field: account_id
      - name: user_id
        description: User that requested the quote.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_app__users')
                field: user_id
      - name: line_of_business
        description: Insurance line of the quote.
      - name: form_started_at
        description: Quote form opened (client).
      - name: submit_clicked_at
        description: Submit button clicked (client). Null when the client event was lost.
      - name: submitted_at
        description: Quote request persisted (server). Null when the quote was abandoned.
      - name: first_carrier_return_at
        description: First carrier price returned (server).
      - name: bound_at
        description: Policy bound (server).
      - name: carriers_requested
        description: Number of carriers the quote was sent to.
      - name: carrier_quotes_returned
        description: Number of carrier prices returned. Never above carriers_requested.
      - name: hours_to_first_return
        description: Hours from submit to the first carrier price.
      - name: days_to_bind
        description: >
          Days from submit to bind. Known issue: about 6% of bound quotes are bound before
          their first carrier return (warning test on this model).
      - name: is_submitted
        description: The server received the quote request.
        data_tests: [not_null]
      - name: has_carrier_response
        description: At least one carrier returned a price.
        data_tests: [not_null]
      - name: is_bound
        description: The quote ended in a bound policy (North Star).
        data_tests: [not_null]
      - name: is_client_submit_lost
        description: Submitted on the server but the client submit click was never tracked.
        data_tests: [not_null]

  - name: fct_account_retention
    description: >
      Weekly cohort retention of accounts. An account is active in a week (Monday to Sunday)
      when it submitted at least one quote; its cohort is its first active week.
      One row per cohort and week since the first one, up to the last complete week of data,
      so weeks without activity show 0.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_week, weeks_since_first]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "active_accounts <= cohort_size"
      # by definition, every account of a cohort is active in its cohort week
      - dbt_utils.expression_is_true:
          arguments:
            expression: "retention_rate = 1"
          config:
            where: "weeks_since_first = 0"
    columns:
      - name: cohort_week
        description: Monday of the account's first active week.
        data_tests: [not_null]
      - name: weeks_since_first
        description: Weeks since the cohort week (0 = the cohort week itself).
        data_tests: [not_null]
      - name: activity_week
        description: Monday of the week being measured (cohort_week + weeks_since_first).
        data_tests: [not_null]
      - name: cohort_size
        description: Accounts whose first active week is cohort_week.
        data_tests: [not_null]
      - name: active_accounts
        description: Accounts of the cohort that submitted at least one quote in activity_week.
        data_tests: [not_null]
      - name: retention_rate
        description: active_accounts / cohort_size, between 0 and 1.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
