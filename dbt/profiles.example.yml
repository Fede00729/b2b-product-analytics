# Add this block to ~/.dbt/profiles.yml and fill in your GCP project.
# BigQuery sandbox (free tier) is enough for this project.
# The identity needs roles/bigquery.dataEditor, roles/bigquery.jobUser and
# roles/bigquery.readSessionUser (dbt v2 reads results through the Storage Read API).
quotebridge_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account  # or `oauth` after `gcloud auth application-default login`
      keyfile: /absolute/path/to/service-account.json  # keep it outside the repo
      project: YOUR_GCP_PROJECT
      dataset: dev
      location: US
      threads: 4
    prod:  # dbt build --target prod
      type: bigquery
      method: service-account
      keyfile: /absolute/path/to/service-account.json
      project: YOUR_GCP_PROJECT
      dataset: prod
      location: US
      threads: 4
