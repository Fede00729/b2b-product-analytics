# Copy to ~/.dbt/profiles.yml and fill in your GCP project.
# BigQuery sandbox (free tier) is enough for this project.
quotebridge_analytics:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth            # run `gcloud auth application-default login` first
      project: YOUR_GCP_PROJECT
      dataset: quotebridge
      location: US
      threads: 4
