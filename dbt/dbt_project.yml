name: quotebridge_analytics
version: "0.1.0"
config-version: 2
profile: quotebridge_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

vars:
  # Salt used to pseudonymize emails. Override in production:
  #   dbt run --vars '{pii_salt: "..."}'  (never commit the real value)
  pii_salt: "local-dev-salt"

models:
  quotebridge_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
